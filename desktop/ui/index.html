<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek Harness</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #0f1115;
        --muted: #81858c;
        --spinner-track: rgba(0, 0, 0, 0.12);
        --spinner: #4176e6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151517;
          --text: #f9fafb;
          --muted: #81858c;
          --spinner-track: rgba(255, 255, 255, 0.12);
          --spinner: #4176e6;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
        background: var(--bg); color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .box { text-align: center; }
      .spinner {
        width: 40px; height: 40px; margin: 0 auto 16px;
        border: 3px solid var(--spinner-track); border-top-color: var(--spinner); border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; color: var(--text); }
      p { font-size: 13px; margin: 0; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spinner"></div>
      <h1>DeepSeek Harness</h1>
      <p>正在启动本地服务，请稍候…</p>
    </div>
  </body>
</html>
